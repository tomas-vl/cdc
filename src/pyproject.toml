[project]
name = "project"
version = "0.1.0"
requires-python = ">=3.14.0"
dependencies = [
  "numpy>=2.4.6",
  "torch>=2.11.0",
  "torchvision>=0.26.0",
  "transformers>=5.9.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
